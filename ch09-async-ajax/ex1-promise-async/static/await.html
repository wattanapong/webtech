<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>async/await</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="mx-auto max-w-xl space-y-4 p-6">
  <h1 class="text-2xl font-bold">async/await + fetch</h1>
  <p id="time" class="text-xl">–</p>
  <button id="btn" class="rounded bg-blue-600 px-4 py-2 text-white">Get server time</button>
  <ul class="list-disc pl-6 text-sm">
    <li><a class="underline" href="/then-ok">/then-ok</a></li>
    <li><a class="underline" href="/then-broken">/then-broken</a> (empty page – why?)</li>
    <li><a class="underline" href="/then-finally">/then-finally</a> · <a class="underline" href="/then-finally?fail">with an error</a></li>
  </ul>
  <script type="module">
    const box = document.querySelector('#time');
    async function showTime() {
      box.textContent = 'Loading…';
      try {
        const res = await fetch('/time');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        box.textContent = data.now;
      } catch (err) {
        box.textContent = `Error: ${err.message}`;
      }
    }
    document.querySelector('#btn').addEventListener('click', showTime);
  </script>
</body>
</html>
