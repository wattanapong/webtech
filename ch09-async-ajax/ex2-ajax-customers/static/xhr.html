<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XHR vs fetch</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="mx-auto max-w-2xl space-y-4 p-6">
  <h1 class="text-2xl font-bold">XMLHttpRequest (legacy) vs fetch (modern)</h1>
  <div class="flex gap-2">
    <button id="xhrBtn" class="rounded border px-3 py-1">Load with XHR</button>
    <button id="fetchBtn" class="rounded bg-blue-600 px-3 py-1 text-white">Load with fetch</button>
  </div>
  <pre id="out" class="rounded bg-gray-900 p-3 text-xs text-green-300">Open DevTools → Network → Fetch/XHR</pre>
  <script type="module">
    const out = document.getElementById('out');
    document.getElementById('xhrBtn').addEventListener('click', () => {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', '/customers/json?page=1&limit=3');
      xhr.onload = () => {
        if (xhr.status === 200) {
          const data = JSON.parse(xhr.responseText); // JSON.parse by hand
          out.textContent = 'XHR:\n' + JSON.stringify(data.rows.map((r) => r.customerName), null, 2);
        }
      };
      xhr.onerror = () => (out.textContent = 'Network error');
      xhr.send();
    });
    document.getElementById('fetchBtn').addEventListener('click', async () => {
      try {
        const res = await fetch('/customers/json?page=1&limit=3');
        if (!res.ok) throw new Error(`HTTP ${res.status}`); // 404/500 do NOT reject
        const data = await res.json();
        out.textContent = 'fetch:\n' + JSON.stringify(data.rows.map((r) => r.customerName), null, 2);
      } catch (err) {
        out.textContent = err.message;
      }
    });
  </script>
</body>
</html>
