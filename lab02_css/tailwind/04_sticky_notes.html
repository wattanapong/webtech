<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4. Sticky notes (sticky.css in Tailwind)</title>
    <!-- Tailwind CSS v4 (Play CDN): one line, no install. Needs internet. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<!-- Same idea as ../sticky.html + css/sticky.css -->
<body class="p-6 font-sans">

    <!-- .title { font-size: 2em } with many @media (max-width) rules
         Tailwind is mobile-first: small text first, bigger from sm: / md: up -->
    <h1 class="text-xl font-bold sm:text-2xl md:text-3xl">This is the example of sticky note.</h1>

    <!-- #stick1, #stick2, #stick3 { width: 200px; height: 200px; padding: 10px;
         margin: 50px 10px 10px; display: inline-block; border-radius: 5px; box-shadow } -->
    <div class="mt-12 flex flex-wrap gap-4">
        <div class="h-52 w-52 rounded bg-purple-400 p-3 shadow-lg">Sticky Note 1</div>
        <div class="h-52 w-52 rounded bg-emerald-400 p-3 shadow-xl">Sticky Note 2</div>
        <div class="h-52 w-52 rounded bg-lime-400 p-3 shadow-2xl">Sticky Note 3</div>
    </div>

    <!-- .message { margin-top: 20px } -->
    <p class="mt-5">This part is the bottom of example text.</p>

</body>
</html>
