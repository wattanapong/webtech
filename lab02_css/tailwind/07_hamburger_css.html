<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7. Hamburger menu (no JavaScript)</title>
    <!-- Tailwind CSS v4 (Play CDN): one line, no install. Needs internet. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="font-sans">

    <!-- HAMBURGER MENU without JavaScript – the same checkbox trick as last year's navbar.html
         1. a hidden checkbox (peer)
         2. a <label> with ☰ – clicking the label ticks / unticks the checkbox
         3. the menu is hidden; peer-checked:block shows it when the checkbox is ticked
         4. from md: (768px) up, the menu is always shown and ☰ is hidden -->
    <nav class="flex flex-wrap items-center justify-between bg-blue-700 px-6 py-4 text-white">

        <a href="#" class="text-xl font-bold">Web Tech</a>

        <input type="checkbox" id="menu-toggle" class="peer hidden">

        <label for="menu-toggle" class="cursor-pointer text-3xl md:hidden">&#9776;</label>

        <ul class="hidden w-full peer-checked:block md:flex md:w-auto md:gap-6">
            <li><a href="#" class="block py-2 hover:text-yellow-300">Home</a></li>
            <li><a href="#" class="block py-2 hover:text-yellow-300">News</a></li>
            <li><a href="#" class="block py-2 hover:text-yellow-300">Contact</a></li>
            <li><a href="#" class="block py-2 hover:text-yellow-300">About</a></li>
        </ul>
    </nav>

    <main class="p-6">
        <h1 class="text-2xl font-bold">Hamburger menu (CSS only)</h1>
        <p class="mt-2">Press F12 → device toolbar → choose a phone (width &lt; 768px), then click ☰.</p>
    </main>

</body>
</html>
