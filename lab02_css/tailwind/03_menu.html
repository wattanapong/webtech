<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3. Menu with hover (index3.html in Tailwind)</title>
    <!-- Tailwind CSS v4 (Play CDN): one line, no install. Needs internet. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<!-- Same page as ../index3.html (main.css + main2.css) -->
<body class="font-sans">

    <header class="bg-violet-500 p-3 text-center text-white">
        <h1 class="text-3xl font-bold">Introduction to Web Technology</h1>
    </header>

    <div class="flex">
        <aside class="h-[80vh] w-40 bg-sky-50 p-5">

            <!-- .menu { font-weight: bold; text-align: center; background: white; padding: 7px 0 } -->
            <h3 class="mb-2 bg-white py-2 text-center font-bold text-blue-700">Menu</h3>

            <!-- li { list-style: none; padding: 5px; background: rgb(197,197,231) }
                 li:hover { background: ...; color: blue }   →   hover: prefix -->
            <ul>
                <li class="mb-1 cursor-pointer bg-indigo-200 p-2 hover:bg-indigo-100 hover:text-blue-700">Home</li>
                <li class="mb-1 cursor-pointer bg-indigo-200 p-2 hover:bg-indigo-100 hover:text-blue-700">News</li>
                <li class="mb-1 cursor-pointer bg-indigo-200 p-2 hover:bg-indigo-100 hover:text-blue-700">Contact Us</li>
                <li class="mb-1 cursor-pointer bg-indigo-200 p-2 hover:bg-indigo-100 hover:text-blue-700">About Us</li>
            </ul>
        </aside>

        <main class="flex-1 p-5 text-center">
            <h2 class="text-xl font-bold">Main Content</h2>
        </main>
    </div>

    <footer class="fixed bottom-0 w-full bg-cyan-200 px-2 py-1 text-right text-blue-700">
        <p>&copy; 2026 Wattanapong Suttapak</p>
    </footer>

</body>
</html>
