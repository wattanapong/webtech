# Optional: run MySQL 8 without installing it.   docker compose up -d
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root-change-me
      MYSQL_USER: webtech
      MYSQL_PASSWORD: change-me
    volumes:
      - ./classicmodels.sql:/docker-entrypoint-initdb.d/01-classicmodels.sql:ro
      - ./grant.sql:/docker-entrypoint-initdb.d/02-grant.sql:ro
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data:
