<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products (CSR with fetch)</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script type="module" src="/js/products.js"></script>
</head>
<body class="mx-auto max-w-3xl space-y-6 bg-slate-50 p-6 text-slate-800">
  <h1 class="text-2xl font-bold">Products</h1>
  <p class="text-sm text-slate-500">This page is static HTML. JavaScript calls <code>/api/products</code> and builds the list in the browser (CSR).</p>

  <form id="product-form" class="grid gap-3 rounded-xl bg-white p-4 shadow sm:grid-cols-4">
    <input name="name" required placeholder="Name" class="rounded border px-3 py-2 sm:col-span-2">
    <input name="price" type="number" min="0" step="0.01" required placeholder="Price" class="rounded border px-3 py-2">
    <input name="stock" type="number" min="0" value="0" placeholder="Stock" class="rounded border px-3 py-2">
    <button class="rounded bg-violet-600 py-2 text-white hover:bg-violet-700 sm:col-span-4">Add product</button>
  </form>
  <p id="error" class="hidden rounded bg-red-50 p-3 text-red-700"></p>

  <input id="search" type="search" placeholder="Search (server-side LIKE ?)" class="w-full rounded border px-3 py-2">
  <ul id="list" class="grid gap-2"></ul>
</body>
</html>
