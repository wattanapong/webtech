<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forms</title>
  <meta name="description" content="CH2 HTML example">
</head>
<body>
  <h1>Forms & built-in validation</h1>

  <h2>A correct login form (POST)</h2>
  <form action="https://httpbin.org/post" method="post">
    <p>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
    </p>
    <p>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" minlength="8" required
             autocomplete="current-password">
    </p>
    <p><label><input type="checkbox" name="remember"> Remember me</label></p>
    <button type="submit">Log in</button>
  </form>

  <h2>Useful input types and validation attributes (GET)</h2>
  <!-- GET puts the data in the URL: look at the address bar after you submit -->
  <form action="https://httpbin.org/get" method="get">
    <p><label for="sid">Student ID (8 digits)</label>
       <input id="sid" name="sid" pattern="[0-9]{8}" title="8 digits" required></p>
    <p><label for="phone">Phone</label>
       <input id="phone" name="phone" type="tel" placeholder="0812345678"></p>
    <p><label for="age">Age</label>
       <input id="age" name="age" type="number" min="15" max="99"></p>
    <p><label for="date">Date</label>
       <input id="date" name="date" type="date"></p>
    <p><label for="faculty">Faculty</label>
      <select id="faculty" name="faculty">
        <option value="ict">ICT</option>
        <option value="eng">Engineering</option>
      </select></p>
    <fieldset>
      <legend>Year</legend>
      <label><input type="radio" name="year" value="1" checked> 1</label>
      <label><input type="radio" name="year" value="2"> 2</label>
    </fieldset>
    <p><label for="note">Note</label><br>
       <textarea id="note" name="note" rows="3" maxlength="200"></textarea></p>
    <button type="submit">Send (GET)</button>
    <button type="reset">Reset</button>
  </form>
</body>
</html>
