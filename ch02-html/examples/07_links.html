<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Links</title>
  <meta name="description" content="CH2 HTML example">
</head>
<body>
  <h1>Links in practice</h1>
  <ul>
    <li><a href="02_semantic.html">Relative link</a></li>
    <li><a href="/requests/42">Root-relative link (/requests/42)</a></li>
    <li><a href="https://www.up.ac.th">Absolute link: UP website</a></li>
    <li><a href="#faq">Jump to FAQ</a></li>
    <li><a href="mailto:help@example.com">Email us</a></li>
    <li><a href="images/cat.png" download>Download the cat picture</a></li>
    <li><a href="https://github.com" target="_blank" rel="noopener">GitHub (new tab)</a></li>
  </ul>
  <p style="height: 120vh">Scroll down…</p>
  <h2 id="faq">FAQ</h2>
  <p>A fragment link (#faq) jumps to the element with id="faq".</p>
</body>
</html>
