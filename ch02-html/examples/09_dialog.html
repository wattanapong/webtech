<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Native dialog</title>
  <meta name="description" content="CH2 HTML example">
  <style>dialog::backdrop { background: rgb(0 0 0 / .5); }</style>
</head>
<body>
  <h1>Native modal with &lt;dialog&gt;</h1>
  <button id="openBtn" type="button">Delete request</button>
  <p>Result: <output id="result">–</output></p>
  <dialog id="confirm">
    <form method="dialog">
      <p>Delete this repair request?</p>
      <button value="cancel">Cancel</button>
      <button value="ok">Delete</button>
    </form>
  </dialog>
  <script>
    const dlg = document.querySelector("#confirm");
    document.querySelector("#openBtn")
      .addEventListener("click", () => dlg.showModal());
    dlg.addEventListener("close", () => {
      document.querySelector("#result").textContent = dlg.returnValue; // "ok" or "cancel"
    });
  </script>
</body>
</html>
