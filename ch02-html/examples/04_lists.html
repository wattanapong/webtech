<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lists</title>
  <meta name="description" content="CH2 HTML example">
</head>
<body>
  <h1>Lists</h1>
  <h2>Unordered list (ul)</h2>
  <!-- type="circle" on <ul> is obsolete → use CSS list-style-type -->
  <ul style="list-style-type: square">
    <li>HTML</li>
    <li>CSS
      <ul>
        <li>TailwindCSS</li>
      </ul>
    </li>
    <li>JavaScript</li>
  </ul>
  <h2>Ordered list (ol) – type and start are still valid</h2>
  <ol type="I" start="3">
    <li>Node.js</li>
    <li>Express</li>
  </ol>
  <h2>Description list (dl)</h2>
  <dl>
    <dt>HTML</dt><dd>Structure of the page</dd>
    <dt>CSS</dt><dd>Presentation of the page</dd>
  </dl>
</body>
</html>
