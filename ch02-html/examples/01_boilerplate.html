<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home · CampusFix</title>
  <meta name="description" content="Report and track dorm repairs.">
</head>
<body>
  <!-- CH2 · Modern HTML Boilerplate
       lang      → screen readers + search engines know the language
       charset   → Thai text displays correctly
       viewport  → page fits a phone screen
       defer     → script runs after the HTML is parsed -->
  <h1>Hello HTML5</h1>
  <p>สวัสดีครับ – Thai text works because of <code>&lt;meta charset="utf-8"&gt;</code>.</p>
</body>
</html>
