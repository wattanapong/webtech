<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Images and media</title>
  <meta name="description" content="CH2 HTML example">
</head>
<body>
  <h1>Images done right</h1>
  <!-- alt describes the image; width/height stop layout jumps -->
  <img src="images/cat.png" alt="Orange kitten sitting" width="200" height="200">
  <figure>
    <img src="images/dog.png" alt="Smiling dog" width="200" height="200" loading="lazy">
    <figcaption>Our dorm mascot</figcaption>
  </figure>
  <!-- picture: the browser picks the first format it supports -->
  <picture>
    <source srcset="images/hero.avif" type="image/avif">
    <source srcset="images/hero.webp" type="image/webp">
    <img src="images/cat.png" alt="Fallback image (cat)" width="120" height="120">
  </picture>

  <h2>Video, audio, embed</h2>
  <video controls width="320" poster="images/dog.png">
    <source src="intro.mp4" type="video/mp4">
    Your browser does not support the video element.
  </video>
  <iframe src="https://www.youtube.com/embed/VIDEO_ID" title="Course intro video (replace VIDEO_ID)"
          width="320" height="180" loading="lazy" allowfullscreen></iframe>
</body>
</html>
