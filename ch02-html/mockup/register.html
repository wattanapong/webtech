<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · CampusFix</title>
  <meta name="description" content="CampusFix – report and track dorm repairs.">
</head>
<body>
  <header>
    <a href="index.html"><img src="images/logo.png" alt="CampusFix home" width="40" height="20"></a>
    <nav>
      <a href="index.html">Home</a> |
      <a href="list.html">Requests</a> |
      <a href="login.html">Log in</a> |
      <a href="register.html">Register</a>
    </nav>
  </header>
  <main>
    <h1>Register</h1>
    <form action="member.html" method="get">
      <p><label for="name">Full name</label>
         <input id="name" name="name" autocomplete="name" required></p>
      <p><label for="email">Email</label>
         <input id="email" name="email" type="email" autocomplete="email" required></p>
      <p><label for="sid">Student ID</label>
         <input id="sid" name="sid" pattern="[0-9]{8}" title="8 digits" required></p>
      <p><label for="password">Password (min 8)</label>
         <input id="password" name="password" type="password" minlength="8"
                autocomplete="new-password" required></p>
      <p><label><input type="checkbox" name="consent" required>
         I agree to the <a href="#privacy">privacy notice</a> (PDPA, CH8)</label></p>
      <button type="submit">Register</button>
    </form>
    <p id="privacy"><small>We store your name, email and student ID only to handle repair requests.</small></p>
  </main>
  <footer>© 2026 CampusFix · Group 1 · 226297 Web Programming Technology</footer>
</body>
</html>
