<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CH4-1 · type="module"</title>
  <!-- type="module" is deferred automatically and can use import/export.
       Modules do NOT work from file:// – use VS Code Live Server. -->
  <script type="module">
    import Calculator, { PI, area } from "../modules/math.js";
    document.querySelector("h1").textContent = `PI = ${PI}, area(2) = ${area(2).toFixed(2)}, 2 + 3 = ${new Calculator().add(2, 3)}`;
  </script>
</head>
<body>
  <h1></h1>
</body>
</html>
