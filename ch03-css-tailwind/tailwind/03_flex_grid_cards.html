<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flex, grid, typography</title>
  <!-- Tailwind v4 Play CDN: for labs and prototypes only (needs internet) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-brand-50:  oklch(0.97 0.02 300);
      --color-brand-600: oklch(0.55 0.22 295);
      --color-brand-700: oklch(0.48 0.22 295);
    }
  </style>
</head>
<body class="bg-slate-100">
  <!-- CH3 · Flex & Grid utilities + colours & typography -->
  <nav class="flex items-center justify-between gap-4 bg-white px-6 py-4 shadow">
    <a href="#" class="text-xl font-bold">UPBook</a>
    <ul class="flex gap-6">
      <li><a href="#" class="hover:text-sky-700">Rooms</a></li>
      <li><a href="#" class="hover:text-sky-700">Login</a></li>
    </ul>
  </nav>
  <main class="grid grid-cols-1 gap-6 p-6 sm:grid-cols-2 lg:grid-cols-3">
    <article class="rounded-xl bg-white p-6 shadow">
      <p class="text-sm font-semibold tracking-wide text-sky-600 uppercase">News</p>
      <h2 class="mt-2 text-2xl font-bold text-slate-900">Library opens 24 hours during exams</h2>
      <p class="mt-3 leading-relaxed text-slate-600">Students can book study rooms online from 1 Feb.</p>
      <a href="#" class="mt-4 inline-block font-medium text-sky-700 underline underline-offset-4">Book now</a>
    </article>
    <div class="rounded-xl bg-white p-6 shadow">B</div>
    <div class="rounded-xl bg-white p-6 shadow">C</div>
  </main>
</body>
</html>
