<body>

  <main class="mx-auto grid max-w-4xl gap-6 p-6 md:grid-cols-2">
    <pre class="overflow-auto rounded-xl bg-slate-900 p-4 text-sm text-slate-100">&lt;div class="container"&gt;
 &lt;div class="row"&gt;
  &lt;div class="col-md-6"&gt;
   &lt;div class="card p-3"&gt;
    &lt;h5 class="card-title"&gt;Room A&lt;/h5&gt;
    &lt;a class="btn btn-primary"&gt;Book&lt;/a&gt;
   &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/div&gt;</pre>
    <div class="rounded-xl bg-white p-4 shadow">
      <h5 class="text-lg font-semibold">Room A</h5>
      <a href="#" class="mt-3 inline-block rounded-lg bg-blue-600 px-4 py-2 text-white hover:bg-blue-700">Book</a>
    </div>
  </main>
