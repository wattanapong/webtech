<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive hero</title>
  <!-- Tailwind v4 Play CDN: for labs and prototypes only (needs internet) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-brand-50:  oklch(0.97 0.02 300);
      --color-brand-600: oklch(0.55 0.22 295);
      --color-brand-700: oklch(0.48 0.22 295);
    }
  </style>
</head>
<body class="bg-white">
  <!-- CH3 · Responsive prefixes are mobile-first: no prefix = phone, md: = 768px and up -->
  <nav class="flex items-center justify-between px-6 py-4 shadow">
    <a href="#" class="font-bold">UPBook</a>
    <!-- menu: hidden on phone, visible from md -->
    <ul class="hidden md:flex md:gap-6"><li><a href="#">Rooms</a></li><li><a href="#">Login</a></li></ul>
    <button class="md:hidden" aria-label="Open menu">☰</button>
  </nav>
  <section class="flex flex-col gap-6 p-6 md:flex-row md:items-center">
    <img src="../mockup-tailwind/images/logo.png" alt="University of Phayao logo" class="w-40 rounded-xl md:w-1/3">
    <div class="md:w-1/2">
      <h1 class="text-3xl font-bold md:text-5xl">Book a study room</h1>
      <p class="mt-4 text-slate-600">Fast and simple, on any device.</p>
      <a href="#" class="mt-6 inline-block rounded-lg bg-sky-600 px-6 py-3 text-white">Get started</a>
    </div>
  </section>
</body>
</html>
