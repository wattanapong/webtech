<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flexbox</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    .navbar { display: flex; justify-content: space-between; align-items: center;
              gap: 1rem; padding: 1rem 2rem; box-shadow: 0 2px 6px rgb(0 0 0 / .1); }
    .navbar ul { display: flex; gap: 1.5rem; list-style: none; margin: 0; padding: 0; }
    .logo { font-weight: bold; font-size: 1.25rem; }
    .center { display: flex; justify-content: center; align-items: center; min-height: 60dvh; }
  </style>
</head>
<body>
  <!-- CH3 · Flexbox: navbar + perfect centring -->
  <nav class="navbar">
    <a href="#" class="logo">UPBook</a>
    <ul><li><a href="#">Rooms</a></li><li><a href="#">Login</a></li></ul>
  </nav>
  <div class="center"><p>Perfectly centred</p></div>
</body>
</html>
