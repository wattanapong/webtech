<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Box model</title>
  <style>
    .box { width: 300px; padding: 20px; border: 5px solid #333; margin: 1rem 0; background: #e0f2fe; }
    .content-box { box-sizing: content-box; }
    .border-box  { box-sizing: border-box; }
    .center { width: 300px; margin: 1rem auto; background: #fde68a; padding: 1rem; }
  </style>
</head>
<body>
  <!-- CH3 · Box model: content → padding → border → margin -->
  <div class="box content-box">content-box: 300 + 2×20 + 2×5 = <b>350px</b> wide</div>
  <div class="box border-box">border-box: exactly <b>300px</b> wide</div>
  <div class="center">margin: 0 auto centres a block that has a width</div>
</body>
</html>
