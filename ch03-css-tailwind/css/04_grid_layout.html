<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page layout with Grid</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; font-family: system-ui, sans-serif;
           grid-template-rows: auto auto 1fr auto;
           grid-template-areas: "header" "aside" "main" "footer"; }
    @media (min-width: 768px) {             /* mobile-first: add columns on larger screens */
      body { grid-template-columns: 200px 1fr; grid-template-rows: auto 1fr auto;
             grid-template-areas: "header header" "aside main" "footer footer"; }
    }
    header { grid-area: header; background: #1e3a8a; color: white; padding: 1rem; }
    aside  { grid-area: aside;  background: #e0e7ff; padding: 1rem; }
    main   { grid-area: main;   padding: 1rem; }
    footer { grid-area: footer; background: #334155; color: white; padding: 1rem; }
  </style>
</head>
<body>
  <!-- CH3 · Updated 2026: page layout with CSS Grid (replaces float + position: fixed) -->
  <header>Header</header>
  <aside>Aside / menu</aside>
  <main><h1>Main content</h1><p>Resize the window below 768px: the layout becomes one column.</p></main>
  <footer>Footer stays at the bottom</footer>
</body>
</html>
