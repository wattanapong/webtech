<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selectors</title>
  <style>
    p, li { font-family: system-ui, sans-serif; }        /* group */
    nav a { color: green; }                              /* descendant */
    ul > li:nth-child(2) { font-weight: bold; }          /* child + pseudo-class */
    input[type="email"] { border: 2px solid steelblue; } /* attribute */
    li::first-letter { color: crimson; }                 /* pseudo-element */
    /* modern selectors */
    .card:has(img) { background: #fef3c7; }              /* parent "contains" */
    form:has(input:invalid) button { opacity: .5; }
    :is(header, footer) a { color: purple; }
    :where(ul, ol) { padding-left: 1.25rem; }            /* zero specificity */
    /* native CSS nesting – no Sass needed */
    .card {
      padding: 1rem; margin: .5rem 0; border: 1px solid #ccc; border-radius: .75rem;
      & h2 { font-size: 1.25rem; margin: 0; }
      &:hover { box-shadow: 0 4px 12px rgb(0 0 0 / .15); }
    }
  </style>
</head>
<body>
  <!-- CH3 · Selector cheat sheet + :has() :is() :where() + nesting -->
  <header><a href="#">Home</a> <a href="#">About</a></header>
  <nav><a href="#">nav link</a></nav>
  <ul><li>one</li><li>two (nth-child 2)</li><li>three</li></ul>
  <form>
    <label for="e">Email</label> <input id="e" type="email" required>
    <button>Send (dim while the email is invalid)</button>
  </form>
  <div class="card"><h2>Card with image</h2><img src="../mockup-tailwind/images/logo.png" alt="logo" width="40" height="20"></div>
  <div class="card"><h2>Card without image</h2><p>text only</p></div>
  <footer><a href="#">footer link</a></footer>
</body>
</html>
