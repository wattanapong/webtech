<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Source</title>
</head>
<body>
    <!-- Try to reshape web browser: width in % follows the window, height in pixels does not -->
    <img src="../images/cat.png" width="20%" alt="cat" />
    <img src="../images/dog.png" height="600" alt="dog" />
</body>
</html>
