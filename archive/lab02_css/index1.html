<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Webpage</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #txt-yellow {
            color: #FF0;
        }

        .txt-blue {
            color: #00F;
        }

        header {
            background-color: #0FF;
            color: rgb(0, 0, 255);
            padding: 10px;
            text-align: center;
        }

        aside {
            background-color: #f4f4f4;
            float: left;
            width: 150px;
            height: 80vh;
            padding: 20px;
        }

        main {
            margin-left: 150px;
            padding: 20px;
        }

        footer {
            background-color: #8FF;
            color: #02F;
            padding: 5px 0px;
            text-align: right;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    
    <header>
        <h1>Your Website Title</h1>
    </header>

    <aside>
        <h2>Sidebar</h2>
        <!-- Add your sidebar content here -->
    </aside>

    <main>
        <h2>Main Content</h2>
        <!-- Add your main content here -->
    </main>

    <footer>
        <p>&copy; 2023 Your Website Name</p>
    </footer>

</body>
</html>
