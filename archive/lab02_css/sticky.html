<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Note</title>
    <link rel="stylesheet" href="css/sticky.css">
    <style>
        .main-layout {
            position: absolute;
        }

        .title {
            position: fixed;
        }

        /* condition when screen < 500px */
        @media (max-width:500px) {
            .title {
                position: relative;
            }
        }
    </style>
</head>
<body>
    
    <div class="main-layout">
        <div class="title">This is the example of sticky note.</div>
        <div id="stick1">Sticky Note 1</div>
        <div id="stick2">Stick Note 2</div>
        <div id="stick3">Stick Note 3</div>
        <div class="message">This part is the bottom of example text.</div>
    </div>

</body>
</html>
