<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Asynchronous</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .main-container {
            max-width: 400px;
            margin: auto;
            margin-top: 100px;
        }
    </style>
</head>

<body>

    <div class="container main-container">
        <div class="text-center text-primary h1 mb-4">Clock <label id="clock"></label></div>
        <div class="text-center text-success h1 mb-4">Clock2 <label id="clock2"></label></div>
        <div class="text-center text-success h1 mb-4">display <label id="display"></label></div>

    </div>

    <script>
        const clock = () => {
            let d = new Date();

            h = d.getHours()
            m = d.getMinutes()
            s = d.getSeconds()

            document.getElementById("clock").innerHTML =
                h + ":" + m + ":" + s;

            document.getElementById("clock2").innerHTML =
                String(h).padStart(2, 0) + ":" +
                String(m).padStart(2,'0') + ":" +
                String(s).padStart(2,'0');
        }

        //setInterval(clock, 3000)
        setTimeout(clock, 3000)
        
        document.getElementById('display').innerHTML = "Hello"

    </script>
</body>

</html>
