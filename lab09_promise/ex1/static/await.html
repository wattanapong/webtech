<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Asynchronous</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .main-container {
            max-width: 400px;
            margin: auto;
            margin-top: 100px;
        }
    </style>
</head>

<body>

    <div class="container main-container">
        <div class="text-center text-primary h1 mb-4 border">
            Bangkok Time: <label id="bangkok"></label>
        </div>
        <div class="text-center text-success h1 mb-4 border">
            Singapore Time: <label id="singapore"></label>
        </div>
        <div class="text-center text-warning h1 mb-4 border">
            New York Time: <label id="newyork"></label>
        </div>
    </div>

    <script>
        t = 1
        async function myDisplay(location) {
            const response = await fetch(`/time?location=${location}`);
            if (!response.ok) {
                throw new Error(`HTTP error! Status: ${response.status}`);
            }
            document.getElementById(location).innerHTML = await response.text();
        }

        setInterval(()=>{
            myDisplay('bangkok');
            if (t % 2 == 0)  myDisplay('singapore');
            if (t % 3 == 0) myDisplay('newyork');
            t++;
        }, 1000)
    </script>
</body>

</html>
