<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Asynchronous</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .main-container {
            max-width: 400px;
            margin: auto;
            margin-top: 100px;
        }
    </style>
</head>

<body>

    <div class="container main-container">
        <div class="text-center text-primary h1 mb-4">Demo: <label id="demo"></label></div>
        <div class="text-center text-success h1 mb-4">Run: <label id="run"></label></div>

    </div>

    <script>
        async function myDisplay(){
            let myPromise = new Promise(function(resolve, reject) {
                setTimeout(function() {
                    resolve("Done");
                }, 1000);
            });

            document.getElementById("demo").innerHTML = await myPromise;
        }


        /*const myDisplay = async () => {
            const myPromise = new Promise(function(resolve, reject) {
                setTimeout(function() {
                    resolve("Done");
                }, 1000);
            });

            document.getElementById("demo").innerHTML = await myPromise;
        }*/

        myDisplay();

        document.getElementById("run").innerHTML = "Loading ...";

    </script>
</body>

</html>
