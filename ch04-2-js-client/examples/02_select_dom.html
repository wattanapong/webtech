<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selecting elements</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="js/02_select_dom.js" defer></script>
</head>
<body class="mx-auto max-w-3xl space-y-6 bg-slate-50 p-6 text-slate-800">
  <!-- CH4-2 · The DOM is a tree. querySelector / querySelectorAll (preferred) vs getElementBy* -->
  <h1 id="title" class="text-2xl font-bold">Products</h1>
  <ul class="list space-y-2">
    <li class="card rounded bg-white p-3">Pen</li>
    <li class="card rounded bg-white p-3">Book</li>
    <li class="card rounded bg-white p-3" hidden>Hidden item</li>
  </ul>
  <input name="email" type="email" value="a@up.ac.th" class="rounded border px-3 py-2">
  <pre id="out" class="rounded bg-slate-900 p-4 text-sm text-green-300"></pre>
</body>
</html>
