<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timers and live search</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="js/07_timers_search.js" defer></script>
</head>
<body class="mx-auto max-w-3xl space-y-6 bg-slate-50 p-6 text-slate-800">
  <!-- CH4-2 · setTimeout / setInterval + live search with debounce -->
  <p class="text-3xl font-bold" id="clock">--:--:--</p>
  <button id="showToast" class="rounded bg-orange-600 px-4 py-2 text-white">Show toast (3 s)</button>
  <div id="toast" class="fixed right-4 bottom-4 hidden rounded bg-slate-800 px-4 py-2 text-white">Saved!</div>
  <input id="search" placeholder="Filter products (debounce 300 ms)" class="w-full rounded border px-3 py-2">
  <ul id="products" class="space-y-1">
    <li class="rounded bg-white p-2">Pen</li><li class="rounded bg-white p-2">Pencil</li>
    <li class="rounded bg-white p-2">Book</li><li class="rounded bg-white p-2">Notebook</li>
    <li class="rounded bg-white p-2">Bag</li>
  </ul>
</body>
</html>
