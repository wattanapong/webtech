<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="js/08_calculator.js" defer></script>
</head>
<body class="mx-auto max-w-3xl space-y-6 bg-slate-50 p-6 text-slate-800">
  <!-- CH4-2 · Calculator example: event delegation on the keypad + data-* attributes -->
  <div class="mx-auto max-w-xs rounded-2xl bg-slate-800 p-4 shadow-xl">
    <output id="display" class="block h-14 overflow-hidden rounded bg-slate-900 px-3 text-right text-3xl leading-[3.5rem] text-white">0</output>
    <div id="keys" class="mt-4 grid grid-cols-4 gap-2 text-lg">
      <button data-key="C" class="col-span-2 rounded bg-red-500 py-3 text-white">C</button>
      <button data-key="back" class="rounded bg-slate-600 py-3 text-white">⌫</button>
      <button data-key="/" class="rounded bg-orange-500 py-3 text-white">÷</button>
      <button data-key="7" class="rounded bg-slate-600 py-3 text-white">7</button>
      <button data-key="8" class="rounded bg-slate-600 py-3 text-white">8</button>
      <button data-key="9" class="rounded bg-slate-600 py-3 text-white">9</button>
      <button data-key="*" class="rounded bg-orange-500 py-3 text-white">×</button>
      <button data-key="4" class="rounded bg-slate-600 py-3 text-white">4</button>
      <button data-key="5" class="rounded bg-slate-600 py-3 text-white">5</button>
      <button data-key="6" class="rounded bg-slate-600 py-3 text-white">6</button>
      <button data-key="-" class="rounded bg-orange-500 py-3 text-white">−</button>
      <button data-key="1" class="rounded bg-slate-600 py-3 text-white">1</button>
      <button data-key="2" class="rounded bg-slate-600 py-3 text-white">2</button>
      <button data-key="3" class="rounded bg-slate-600 py-3 text-white">3</button>
      <button data-key="+" class="rounded bg-orange-500 py-3 text-white">+</button>
      <button data-key="0" class="col-span-2 rounded bg-slate-600 py-3 text-white">0</button>
      <button data-key="." class="rounded bg-slate-600 py-3 text-white">.</button>
      <button data-key="=" class="rounded bg-green-600 py-3 text-white">=</button>
    </div>
  </div>
</body>
</html>
