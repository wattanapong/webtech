<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="js/05_events.js" defer></script>
</head>
<body class="mx-auto max-w-3xl space-y-6 bg-slate-50 p-6 text-slate-800">
  <!-- CH4-2 · addEventListener, event object, propagation, delegation, preventDefault -->
  <button id="save" class="rounded bg-orange-600 px-4 py-2 text-white">Save (look at the console)</button>
  <h2 class="text-xl font-bold">Event delegation: one listener on &lt;ul&gt;</h2>
  <ul id="cart" class="space-y-2">
    <li class="flex justify-between rounded bg-white p-2">Pen <button data-id="1" class="del text-red-600">✕</button></li>
    <li class="flex justify-between rounded bg-white p-2">Ink <button data-id="2" class="del text-red-600">✕</button></li>
  </ul>
  <button id="addCart" class="rounded border px-3 py-1">Add an item later (delete still works)</button>
  <h2 class="text-xl font-bold">preventDefault</h2>
  <form id="search-form" class="flex gap-2">
    <input name="q" placeholder="search" class="flex-1 rounded border px-3 py-2">
    <button class="rounded bg-slate-800 px-4 text-white">Search (no reload)</button>
  </form>
  <p id="searchOut"></p>
  <a class="external text-orange-700 underline" href="https://www.up.ac.th">External link (asks first)</a>
  <p class="text-sm text-slate-500">Press Ctrl+K or Escape – see the console.</p>
</body>
</html>
