<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dialog instead of alert</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="js/01_dialog.js" defer></script>
</head>
<body class="mx-auto max-w-3xl space-y-6 bg-slate-50 p-6 text-slate-800">
  <!-- CH4-2 · Use <dialog> instead of alert(). alert/prompt/confirm block the page and cannot be styled. -->
  <h1 class="text-2xl font-bold">&lt;dialog&gt; instead of alert()</h1>
  <button id="open" class="rounded bg-orange-600 px-4 py-2 text-white">Open</button>
  <button id="old" class="rounded border px-4 py-2">Old way: alert()</button>
  <dialog id="box" class="m-auto rounded-xl p-6 backdrop:bg-black/50">
    <h2 class="text-lg font-bold">Welcome!</h2>
    <form method="dialog"><button class="mt-4 rounded bg-slate-800 px-3 py-1 text-white">Close</button></form>
  </dialog>
</body>
</html>
